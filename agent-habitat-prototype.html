<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人 Agent 栖息地 — 原型</title>
<style>
/* ===== 调色板 ===== */
:root {
  --ink-deep: #0f1828;
  --ink-mid: #1a2332;
  --ink-soft: #2a3548;
  --fog: rgba(180, 195, 210, 0.06);
  --fog-light: rgba(200, 210, 220, 0.03);
  --hairline: rgba(120, 140, 160, 0.12);
  --text: #e8ecf0;
  --text-muted: #8a9aae;
  --text-dim: #5a6a7e;
  --jade: #8ef0bf;
  --ultramarine: #5b7fff;
  --amber: #ffc35a;
  --vermillion: #ff7a6f;
  --glass: rgba(30, 42, 58, 0.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--ink-deep);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== 背景大气层 ===== */
.habitat-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(91, 127, 255, 0.06), transparent 60%),
    radial-gradient(ellipse 60% 40% at 30% 100%, rgba(255, 195, 90, 0.04), transparent 50%),
    radial-gradient(ellipse 50% 60% at 80% 60%, rgba(142, 240, 191, 0.03), transparent 50%),
    linear-gradient(180deg, var(--ink-mid) 0%, var(--ink-deep) 100%);
}

/* 远山轮廓 */
.mountains {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 40vh;
  z-index: 1;
  opacity: 0.35;
  pointer-events: none;
}

/* 科幻网格 */
.grid-overlay {
  position: fixed;
  inset: 0;
  z-index: 2;
  background-image:
    linear-gradient(rgba(91, 127, 255, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(91, 127, 255, 0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 80%);
}

/* 雾气流动 */
@keyframes fogDrift {
  0% { transform: translateX(-5%); opacity: 0.4; }
  50% { transform: translateX(5%); opacity: 0.6; }
  100% { transform: translateX(-5%); opacity: 0.4; }
}

.fog-layer {
  position: fixed;
  bottom: 20vh;
  left: -10%;
  width: 120%;
  height: 200px;
  z-index: 2;
  background: radial-gradient(ellipse 50% 100% at 50% 50%, var(--fog), transparent 70%);
  animation: fogDrift 24s ease-in-out infinite;
  pointer-events: none;
}

/* ===== 主容器 ===== */
.habitat {
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100vh;
  max-width: 1480px;
  margin: 0 auto;
  padding: 32px 36px;
  gap: 24px;
}

/* ===== 顶部问候栏 ===== */
.top-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.greeting {
  flex: 0 0 auto;
}

.greeting-time {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.greeting-text {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}

.greeting-text .highlight {
  color: var(--jade);
  font-weight: 700;
}

.greeting-text .count {
  color: var(--amber);
}

.input-zone {
  flex: 1 1 300px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.input-field {
  flex: 1;
  height: 46px;
  padding: 0 18px;
  background: var(--glass);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  outline: none;
  backdrop-filter: blur(8px);
  transition: border-color 0.2s;
}

.input-field::placeholder { color: var(--text-dim); }
.input-field:focus { border-color: rgba(142, 240, 191, 0.4); }

.publish-btn {
  height: 46px;
  padding: 0 24px;
  background: var(--jade);
  color: #0a1f14;
  border: none;
  border-radius: 4px;
  font: inherit;
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.1s, box-shadow 0.2s;
  box-shadow: 0 0 20px rgba(142, 240, 191, 0.2);
}

.publish-btn:hover { box-shadow: 0 0 28px rgba(142, 240, 191, 0.35); transform: translateY(-1px); }

/* ===== 主区域：栖息地 + 决策面板 ===== */
.main-area {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 24px;
  min-height: 480px;
}

/* === Agent 栖息地空间 === */
.habitat-space {
  position: relative;
  background:
    radial-gradient(ellipse 60% 50% at 50% 50%, rgba(26, 35, 50, 0.4), transparent 70%),
    rgba(15, 24, 40, 0.3);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  overflow: hidden;
  backdrop-filter: blur(4px);
}

.habitat-label {
  position: absolute;
  top: 16px;
  left: 18px;
  font-size: 0.68rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  z-index: 5;
}

.habitat-status {
  position: absolute;
  top: 16px;
  right: 18px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.68rem;
  color: var(--text-muted);
  z-index: 5;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--jade);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* === SVG 场景 === */
.habitat-scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* === Agent 样式 === */
.agent {
  position: absolute;
  width: 48px;
  height: 64px;
  transform: translate(-50%, -50%);
}

.agent-glow {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  opacity: 0.5;
  filter: blur(12px);
}

.agent-body {
  position: relative;
  width: 100%;
  height: 100%;
}

/* 常驻管家 Agent — 琥珀色 */
.agent-keeper {
  left: 35%;
  top: 55%;
}

.agent-keeper .agent-glow {
  background: radial-gradient(circle, var(--amber), transparent 70%);
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.35; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(1.08); }
}

/* 临时探索 Agent — 青绿色 */
.agent-explorer {
  left: 22%;
  top: 38%;
  animation: floatSearch 8s ease-in-out infinite;
}

.agent-explorer .agent-glow {
  background: radial-gradient(circle, var(--jade), transparent 70%);
  animation: breathe 3s ease-in-out infinite;
}

@keyframes floatSearch {
  0%, 100% { transform: translate(-50%, -50%); }
  25% { transform: translate(-45%, -55%); }
  50% { transform: translate(-55%, -48%); }
  75% { transform: translate(-48%, -52%); }
}

/* 临时分析 Agent — 群青色 */
.agent-analyst {
  left: 48%;
  top: 32%;
  animation: floatAnalyze 10s ease-in-out infinite;
}

.agent-analyst .agent-glow {
  background: radial-gradient(circle, var(--ultramarine), transparent 70%);
  animation: breathe 3.5s ease-in-out infinite 0.5s;
}

@keyframes floatAnalyze {
  0%, 100% { transform: translate(-50%, -50%); }
  33% { transform: translate(-53%, -46%); }
  66% { transform: translate(-47%, -53%); }
}

/* 请求决策 Agent — 朱砂色，走到右边界 */
.agent-requester {
  right: 12%;
  top: 50%;
  left: auto;
  transform: translate(0, -50%);
}

.agent-requester .agent-glow {
  background: radial-gradient(circle, var(--vermillion), transparent 70%);
  animation: breathe 2.5s ease-in-out infinite;
}

/* Agent 问题卡 */
.question-card-float {
  position: absolute;
  right: 58px;
  top: -8px;
  width: 140px;
  padding: 10px 12px;
  background: rgba(255, 122, 111, 0.12);
  border: 1px solid rgba(255, 122, 111, 0.35);
  border-radius: 4px;
  font-size: 0.72rem;
  color: #ffd5d1;
  backdrop-filter: blur(8px);
  animation: cardFloat 3s ease-in-out infinite;
}

.question-card-float::after {
  content: "";
  position: absolute;
  right: -6px;
  top: 16px;
  width: 0;
  height: 0;
  border-left: 6px solid rgba(255, 122, 111, 0.35);
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
}

@keyframes cardFloat {
  0%, 100% { transform: translateY(0); opacity: 0.9; }
  50% { transform: translateY(-4px); opacity: 1; }
}

/* === 光流连接线 === */
.light-stream {
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  opacity: 0.5;
  stroke-dasharray: 4 8;
  animation: streamFlow 3s linear infinite;
}

@keyframes streamFlow {
  to { stroke-dashoffset: -24; }
}

/* === 搜索浮窗 === */
.search-windows {
  position: absolute;
  left: 22%;
  top: 38%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.search-win {
  position: absolute;
  width: 64px;
  height: 40px;
  background: rgba(142, 240, 191, 0.08);
  border: 1px solid rgba(142, 240, 191, 0.25);
  border-radius: 3px;
  backdrop-filter: blur(4px);
  animation: winAppear 4s ease-in-out infinite;
}

.search-win:nth-child(1) { top: -50px; left: -50px; animation-delay: 0s; }
.search-win:nth-child(2) { top: -40px; left: 50px; animation-delay: 1s; }
.search-win:nth-child(3) { top: 30px; left: -60px; animation-delay: 2s; }

@keyframes winAppear {
  0%, 100% { opacity: 0; transform: scale(0.8) translateY(4px); }
  40%, 60% { opacity: 0.7; transform: scale(1) translateY(0); }
}

/* === 决策面板 === */
.decision-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel-header {
  font-size: 0.72rem;
  color: var(--amber);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 4px 0;
}

.decision-card {
  padding: 16px 18px;
  background: var(--glass);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  backdrop-filter: blur(8px);
  transition: border-color 0.2s, transform 0.15s;
  cursor: pointer;
}

.decision-card:hover {
  border-color: rgba(255, 195, 90, 0.3);
  transform: translateX(-2px);
}

.decision-card-type {
  font-size: 0.62rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.decision-card-text {
  font-size: 0.86rem;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 10px;
}

.decision-card-actions {
  display: flex;
  gap: 8px;
}

.decision-btn {
  flex: 1;
  height: 32px;
  border: 1px solid var(--hairline);
  background: transparent;
  color: var(--text-muted);
  border-radius: 3px;
  font: inherit;
  font-size: 0.74rem;
  cursor: pointer;
  transition: all 0.15s;
}

.decision-btn:hover { border-color: var(--text-muted); color: var(--text); }
.decision-btn.primary { background: var(--amber); color: #2a1f08; border-color: var(--amber); font-weight: 600; }
.decision-btn.primary:hover { background: #ffd070; }

/* === 底部 24h 时间线 === */
.timeline-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 14px 20px;
  background: var(--glass);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  backdrop-filter: blur(8px);
}

.timeline-label {
  flex: 0 0 auto;
  font-size: 0.68rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.timeline-track {
  flex: 1;
  position: relative;
  height: 32px;
  display: flex;
  align-items: center;
}

.timeline-line {
  width: 100%;
  height: 2px;
  background: var(--hairline);
  border-radius: 1px;
  position: relative;
}

.timeline-progress {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 62%;
  background: linear-gradient(90deg, var(--ultramarine), var(--jade));
  border-radius: 1px;
  opacity: 0.6;
}

.timeline-milestone {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink-deep);
  border: 2px solid var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
}

.timeline-milestone.done { border-color: var(--jade); background: var(--jade); box-shadow: 0 0 8px rgba(142, 240, 191, 0.4); }
.timeline-milestone.current { border-color: var(--amber); background: var(--amber); box-shadow: 0 0 10px rgba(255, 195, 90, 0.5); animation: pulse 2s infinite; }

.timeline-milestone:hover { transform: translate(-50%, -50%) scale(1.3); }

.timeline-time {
  flex: 0 0 auto;
  font-size: 0.72rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.timeline-replay {
  flex: 0 0 auto;
  height: 30px;
  padding: 0 12px;
  background: transparent;
  border: 1px solid var(--hairline);
  color: var(--text-muted);
  border-radius: 3px;
  font: inherit;
  font-size: 0.72rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}

.timeline-replay:hover { border-color: var(--ultramarine); color: var(--ultramarine); }

/* === 响应式 === */
@media (max-width: 960px) {
  .main-area { grid-template-columns: 1fr; }
  .habitat-space { min-height: 360px; }
}
</style>
</head>
<body>

<!-- 背景层 -->
<div class="habitat-bg"></div>
<svg class="mountains" viewBox="0 0 1440 400" preserveAspectRatio="none">
  <path d="M0,400 L0,280 L120,200 L240,250 L360,160 L480,220 L600,140 L720,190 L840,120 L960,180 L1080,100 L1200,170 L1320,130 L1440,190 L1440,400 Z" fill="rgba(26,35,50,0.5)"/>
  <path d="M0,400 L0,320 L100,260 L200,300 L320,230 L440,280 L560,220 L680,270 L800,210 L920,260 L1040,200 L1160,250 L1280,220 L1440,270 L1440,400 Z" fill="rgba(42,53,72,0.6)"/>
  <path d="M0,400 L0,350 L80,320 L180,340 L280,310 L400,335 L520,315 L640,340 L760,320 L880,345 L1000,325 L1120,350 L1240,330 L1360,355 L1440,340 L1440,400 Z" fill="rgba(58,72,95,0.5)"/>
</svg>
<div class="grid-overlay"></div>
<div class="fog-layer"></div>

<!-- 主容器 -->
<div class="habitat">

  <!-- 顶部问候栏 -->
  <div class="top-bar">
    <div class="greeting">
      <div class="greeting-time">上午好 · 周二</div>
      <div class="greeting-text">
        早上好，林。过去 8 小时，<span class="highlight">Agent</span> 完成了 <span class="count">6</span> 件事。
      </div>
    </div>
    <div class="input-zone">
      <input class="input-field" type="text" placeholder="告诉 Agent 你想完成什么……" />
      <button class="publish-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l14 0M13 6l6 6-6 6"/></svg>
        发布需求
      </button>
    </div>
  </div>

  <!-- 主区域 -->
  <div class="main-area">

    <!-- Agent 栖息地 -->
    <div class="habitat-space">
      <div class="habitat-label">AGENT 栖息地</div>
      <div class="habitat-status">
        <span class="status-dot"></span>
        3 个 Agent 运行中 · 1 项等待你
      </div>

      <!-- SVG 场景：光流连接 -->
      <svg class="habitat-scene" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid meet">
        <!-- 管家(280,264) ↔ 探索(176,182) -->
        <path class="light-stream" stroke="var(--amber)" d="M280,264 Q220,220 176,182" />
        <!-- 管家(280,264) ↔ 分析(384,154) -->
        <path class="light-stream" stroke="var(--amber)" d="M280,264 Q330,200 384,154" />
        <!-- 探索(176,182) ↔ 分析(384,154) -->
        <path class="light-stream" stroke="var(--jade)" d="M176,182 Q280,140 384,154" />
        <!-- 管家(280,264) → 请求者(右边界) -->
        <path class="light-stream" stroke="var(--vermillion)" d="M280,264 Q420,280 560,240" />
      </svg>

      <!-- 搜索浮窗（探索 Agent 周围） -->
      <div class="search-windows">
        <div class="search-win"></div>
        <div class="search-win"></div>
        <div class="search-win"></div>
      </div>

      <!-- 常驻管家 Agent（琥珀） -->
      <div class="agent agent-keeper">
        <div class="agent-glow"></div>
        <svg class="agent-body" viewBox="0 0 48 64" fill="none">
          <!-- 头 -->
          <circle cx="24" cy="16" r="9" fill="var(--amber)" opacity="0.85"/>
          <!-- 身体 -->
          <path d="M14,28 Q14,24 24,24 Q34,24 34,28 L34,52 Q34,58 24,58 Q14,58 14,52 Z" fill="var(--amber)" opacity="0.75"/>
          <!-- 稳定底座光晕 -->
          <ellipse cx="24" cy="60" rx="16" ry="3" fill="var(--amber)" opacity="0.2"/>
        </svg>
      </div>

      <!-- 临时探索 Agent（青绿） -->
      <div class="agent agent-explorer">
        <div class="agent-glow"></div>
        <svg class="agent-body" viewBox="0 0 48 64" fill="none">
          <circle cx="24" cy="15" r="8" fill="var(--jade)" opacity="0.85"/>
          <path d="M15,26 Q15,23 24,23 Q33,23 33,26 L33,50 Q33,55 24,55 Q15,55 15,50 Z" fill="var(--jade)" opacity="0.7"/>
          <!-- 携带信息碎片 -->
          <rect x="36" y="20" width="8" height="6" rx="1" fill="var(--jade)" opacity="0.4"/>
          <rect x="4" y="30" width="8" height="6" rx="1" fill="var(--jade)" opacity="0.4"/>
        </svg>
      </div>

      <!-- 临时分析 Agent（群青） -->
      <div class="agent agent-analyst">
        <div class="agent-glow"></div>
        <svg class="agent-body" viewBox="0 0 48 64" fill="none">
          <circle cx="24" cy="15" r="8" fill="var(--ultramarine)" opacity="0.85"/>
          <path d="M15,26 Q15,23 24,23 Q33,23 33,26 L33,50 Q33,55 24,55 Q15,55 15,50 Z" fill="var(--ultramarine)" opacity="0.7"/>
          <!-- 上方数据结构 -->
          <rect x="16" y="4" width="16" height="3" rx="1" fill="var(--ultramarine)" opacity="0.5"/>
          <rect x="12" y="0" width="24" height="2" rx="1" fill="var(--ultramarine)" opacity="0.3"/>
        </svg>
      </div>

      <!-- 请求决策 Agent（朱砂，右边界） -->
      <div class="agent agent-requester">
        <div class="agent-glow"></div>
        <svg class="agent-body" viewBox="0 0 48 64" fill="none">
          <circle cx="24" cy="16" r="8" fill="var(--vermillion)" opacity="0.85"/>
          <path d="M15,27 Q15,24 24,24 Q33,24 33,27 L33,51 Q33,56 24,56 Q15,56 15,51 Z" fill="var(--vermillion)" opacity="0.7"/>
        </svg>
        <!-- 浮动问题卡 -->
        <div class="question-card-float">
          预算提高 ¥20？<br/>
          <span style="color: var(--text-dim); font-size: 0.65rem;">采集范围扩展至港股</span>
        </div>
      </div>
    </div>

    <!-- 决策面板 -->
    <div class="decision-panel">
      <div class="panel-header">需要你回应 · 3</div>

      <div class="decision-card">
        <div class="decision-card-type">权限请求</div>
        <div class="decision-card-text">是否发送报价给客户 A？Agent 已准备好邮件草稿。</div>
        <div class="decision-card-actions">
          <button class="decision-btn">稍后</button>
          <button class="decision-btn">拒绝</button>
          <button class="decision-btn primary">批准</button>
        </div>
      </div>

      <div class="decision-card">
        <div class="decision-card-type">预算</div>
        <div class="decision-card-text">预算提高 ¥20？采集范围扩展至港股数据源。</div>
        <div class="decision-card-actions">
          <button class="decision-btn">稍后</button>
          <button class="decision-btn">拒绝</button>
          <button class="decision-btn primary">同意</button>
        </div>
      </div>

      <div class="decision-card">
        <div class="decision-card-type">方案选择</div>
        <div class="decision-card-text">两个方案选一个：A 快速验证 / B 深度分析。</div>
        <div class="decision-card-actions">
          <button class="decision-btn">方案 A</button>
          <button class="decision-btn">方案 B</button>
        </div>
      </div>
    </div>
